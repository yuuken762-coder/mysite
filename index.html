<!DOCTYPE html>                                                                                                                                                                                                                           
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀のすすめ</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      color: #f4f0e5;
      background: #101010;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      background:
        radial-gradient(ellipse at 12% 12%, #7d171c35, transparent 32rem),
        radial-gradient(ellipse at 92% 38%, #b28a2920, transparent 34rem),
        #101010;
      line-height: 1.8;
    }

    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      perspective: 1000px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid #e6c46c55;
      border-radius: 8px 8px 8px 42px;
      background:
        linear-gradient(115deg, #211d18f2, #171513eF 58%, #381719e8),
        #171513;
      box-shadow: 0 30px 90px #0009, inset 0 1px #fff2;
      animation: rise-in 850ms cubic-bezier(.2,.8,.2,1) both;
    }

    .hero::before {
      position: absolute;
      top: -45%;
      right: -20%;
      width: 70%;
      height: 190%;
      background: linear-gradient(90deg, transparent, #f8e6ae30, transparent);
      content: "";
      transform: rotate(25deg);
      animation: light-sweep 4s ease-in-out 300ms infinite;
      pointer-events: none;
    }

    .hero::after {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 86px;
      height: 86px;
      border: 2px solid #e6c46c45;
      border-top-color: #ffe9a1;
      border-radius: 50%;
      content: "";
      box-shadow: 0 0 0 10px #e6c46c0d, 0 0 35px #e6c46c20;
      animation: seal-spin 5s linear infinite, seal-pulse 1.8s ease-in-out infinite alternate;
      pointer-events: none;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #f4d781;
      font-size: clamp(2.8rem, 10vw, 5.4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      line-height: 1.25;
      text-shadow: 0 4px 30px #f4c95b35;
      animation: title-glow 1.6s ease-in-out infinite alternate;
    }

    .updated {
      position: relative;
      z-index: 1;
      margin: 12px 0 20px;
      color: #bdb5a5;
      font-size: 0.82rem;
    }

    .lead {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #e8dfcd;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
    }

    .feature-image {
      display: block;
      width: 100%;
      max-height: 460px;
      margin: 24px 0 44px;
      border: 1px solid #e6c46c66;
      border-radius: 8px 8px 8px 36px;
      object-fit: cover;
      box-shadow: 0 24px 60px #0009, 0 0 36px #a02b2020;
      animation: rise-in 900ms 120ms cubic-bezier(.2,.8,.2,1) both;
      transition: transform 450ms cubic-bezier(.2,.8,.2,1), box-shadow 450ms ease;
    }

    .feature-image:hover {
      transform: scale(1.015) rotate(-0.3deg);
      box-shadow: 0 30px 75px #000b, 0 0 44px #c534252e;
    }

    section {
      margin: 0 0 28px;
      padding: clamp(24px, 5vw, 36px);
      border: 1px solid #ffffff18;
      border-left: 3px solid #a72c2b;
      border-radius: 4px 16px 16px 4px;
      background: linear-gradient(115deg, #1c1b19, #171615);
      box-shadow: 0 16px 38px #0004, inset 0 1px #ffffff08;
      animation: rise-in 700ms both;
      transition: transform 250ms ease, border-color 250ms ease, box-shadow 250ms ease;
    }

    section:hover {
      transform: translateY(-4px);
      border-left-color: #f0cc69;
      box-shadow: 0 22px 48px #0007, 0 0 24px #e6c46c12;
    }

    h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: #f0d17b;
      font-size: 1.35rem;
    }

    h2::before {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #bd3931;
      content: "";
      box-shadow: 0 0 12px #ec544566;
      transform: rotate(45deg);
    }

    ul {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      padding: 12px 16px;
      border: 1px solid #ffffff14;
      border-radius: 4px 10px 10px 4px;
      background: #ffffff06;
      transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
    }

    li:hover {
      transform: translateX(6px);
      border-color: #e6c46c55;
      background: #e6c46c0d;
    }

    .note {
      margin: 0;
      padding: 18px 20px;
      border-left: 3px solid #bd3931;
      border-radius: 0 10px 10px 0;
      background: linear-gradient(90deg, #a72c2b1f, #a72c2b05);
      color: #f3dfb2;
    }

    a {
      color: #f0d17b;
      text-decoration-color: #f0d17b80;
      text-underline-offset: 4px;
      transition: color 200ms ease;
    }

    a:hover { color: #fff4cd; }

    .about p { margin: 0; color: #c7bfae; }

    section:nth-of-type(1) { animation-delay: 180ms; }
    section:nth-of-type(2) { animation-delay: 280ms; }
    section:nth-of-type(3) { animation-delay: 380ms; }
    section:nth-of-type(4) { animation-delay: 480ms; }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes light-sweep {
      0% { transform: translateX(-150%) rotate(25deg); }
      70%, 100% { transform: translateX(180%) rotate(25deg); }
    }

    @keyframes seal-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes seal-pulse {
      from { box-shadow: 0 0 0 8px #e6c46c0d, 0 0 24px #e6c46c20; }
      to { box-shadow: 0 0 0 15px #e6c46c1c, 0 0 46px #f0cc6960; }
    }

    @keyframes title-glow {
      from { text-shadow: 0 4px 18px #f4c95b35; }
      to { text-shadow: 0 4px 38px #f4c95bba; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 520px) {
      body { padding: 20px 14px; }
      .hero { border-radius: 6px 6px 6px 28px; }
      .feature-image { margin: 18px 0 28px; }
      section { margin-bottom: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>麻雀のすすめ</h1>
      <p class="updated">最終更新：2026 年 11 月 18 日</p>
      <p class="lead">死ぬまでに一度は遊んでほしい、麻雀を紹介します。</p>
    </header>

    <img class="feature-image" src="Images/Image.jpg" alt="麻雀卓と麻雀牌の写真">

    <section>
      <h2>おすすめの理由</h2>
      <ul>
        <li>頭がよくなる</li>
        <li>友達と一緒に遊べる</li>
        <li>とにかく楽しい</li>
      </ul>
    </section>

    <section>
      <h2>はじめての人へ</h2>
      <p class="note">迷ったら字牌、端の牌を切る。まずはリーチ！</p>
    </section>

    <section>
      <h2>オススメのページ</h2>
      <ul>
        <li><a href="https://m-league.jp/">Mリーグ公式サイト（Mリーグ戦公式サイト）</a></li>
      </ul>
    </section>

    <section class="about">
      <h2>このページについて</h2>
      <p>作者：じゃんかす（ニックネーム）／画像：自作／ICT 入門の授業で作成</p>
    </section>
  </main>
</body>
</html>
